name: Generate Blog Data and Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # CHECKOUT REPOSITORY
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================
      # GENERATE posts.json + sitemap.xml
      # =========================================
      - name: Generate posts.json and sitemap.xml
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          from html import unescape
          from urllib.parse import quote
          from xml.sax.saxutils import escape

          # =========================================
          # WEBSITE
          # =========================================

          SITE_URL = "https://sakshi0035.github.io/beyond-the-obvious"

          POSTS_DIR = "posts"

          # =========================================
          # HELPERS
          # =========================================

          def clean_text(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          def get_meta(content, name):
              pattern = (
                  rf'<meta[^>]+name=["\']{re.escape(name)}["\']'
                  rf'[^>]+content=["\']([^"\']*)["\']'
              )

              match = re.search(
                  pattern,
                  content,
                  re.IGNORECASE
              )

              if match:
                  return match.group(1).strip()

              return ""


          def get_title(content):
              # First preference: article H1
              match = re.search(
                  r"<h1[^>]*>(.*?)</h1>",
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  return clean_text(match.group(1))

              # Fallback: HTML title
              match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  return clean_text(match.group(1))

              return "Untitled"


          def get_excerpt(content):
              # First preference: post-excerpt meta
              meta_excerpt = get_meta(
                  content,
                  "post-excerpt"
              )

              if meta_excerpt:
                  return clean_text(meta_excerpt)

              # Fallback: first paragraph inside post-content
              content_match = re.search(
                  r'<div[^>]+class=["\'][^"\']*post-content[^"\']*["\'][^>]*>'
                  r'(.*?)'
                  r'</div>',
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if content_match:
                  paragraphs = re.findall(
                      r"<p[^>]*>(.*?)</p>",
                      content_match.group(1),
                      re.IGNORECASE | re.DOTALL
                  )

                  if paragraphs:
                      return clean_text(paragraphs[0])

              return ""


          def get_featured_image(content):
              # Look specifically for an image using
              # class="post-featured-image"
              #
              # This is intentional.
              # The hero/banner image must NEVER become
              # a default post image.

              match = re.search(
                  r'<img[^>]+class=["\'][^"\']*post-featured-image[^"\']*["\']'
                  r'[^>]+src=["\']([^"\']+)["\']',
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  return match.group(1).strip()

              # Also support src before class
              match = re.search(
                  r'<img[^>]+src=["\']([^"\']+)["\']'
                  r'[^>]+class=["\'][^"\']*post-featured-image[^"\']*["\']',
                  content,
                  re.IGNORECASE | re.DOTALL
              )

              if match:
                  return match.group(1).strip()

              return ""


          def get_search_text(content):
              return clean_text(content)


          # =========================================
          # READ ALL BLOG POSTS
          # =========================================

          posts = []

          if os.path.isdir(POSTS_DIR):

              for filename in os.listdir(POSTS_DIR):

                  # Only .html files
                  if not filename.lower().endswith(".html"):
                      continue

                  filepath = os.path.join(
                      POSTS_DIR,
                      filename
                  )

                  if not os.path.isfile(filepath):
                      continue

                  try:

                      with open(
                          filepath,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          content = f.read()

                      title = get_title(content)

                      category = get_meta(
                          content,
                          "post-category"
                      )

                      date = get_meta(
                          content,
                          "post-date"
                      )

                      excerpt = get_excerpt(
                          content
                      )

                      image = get_featured_image(
                          content
                      )

                      search_text = get_search_text(
                          content
                      )

                      # =================================
                      # IMPORTANT URL ENCODING
                      # =================================
                      #
                      # This safely handles filenames such as:
                      #
                      # The-God-Aditi-Cast-Away:-Who-Was-Mārtāṇḍa?.html
                      #
                      # The ? MUST NOT be left unencoded,
                      # otherwise it can be interpreted as a
                      # query string instead of part of the filename.
                      #
                      encoded_filename = quote(
                          filename,
                          safe="-_.~"
                      )

                      post_url = (
                          "posts/" +
                          encoded_filename
                      )

                      posts.append({
                          "filename": filename,
                          "url": post_url,
                          "title": title,
                          "category": category,
                          "date": date,
                          "excerpt": excerpt,
                          "image": image,
                          "searchText": search_text
                      })

                  except Exception as error:

                      print(
                          f"Could not process {filename}: {error}"
                      )


          # =========================================
          # SORT POSTS
          # =========================================
          #
          # Newest year first.
          # =========================================

          def sort_key(post):

              date_value = post.get(
                  "date",
                  ""
              )

              match = re.search(
                  r"(20\d{2})",
                  date_value
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return 0


          posts.sort(
              key=sort_key,
              reverse=True
          )


          # =========================================
          # WRITE posts.json
          # =========================================

          with open(
              "posts.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  posts,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================
          # GENERATE SITEMAP URLS
          # =========================================

          sitemap_urls = [

              # Homepage
              f"{SITE_URL}/",

              # Static pages
              f"{SITE_URL}/about.html",
              f"{SITE_URL}/contact.html"
          ]


          # Add every blog post
          for post in posts:

              sitemap_urls.append(
                  f"{SITE_URL}/{post['url']}"
              )


          # =========================================
          # WRITE sitemap.xml
          # =========================================

          xml_lines = [

              '<?xml version="1.0" encoding="UTF-8"?>',

              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]


          for url in sitemap_urls:

              xml_lines.append(
                  "  <url>"
              )

              xml_lines.append(
                  f"    <loc>{escape(url)}</loc>"
              )

              xml_lines.append(
                  "  </url>"
              )


          xml_lines.append(
              "</urlset>"
          )


          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(xml_lines)
                  + "\n"
              )


          # =========================================
          # OUTPUT
          # =========================================

          print(
              f"Generated posts.json with {len(posts)} posts."
          )

          print(
              f"Generated sitemap.xml with {len(sitemap_urls)} URLs."
          )

          print("")
          print("Sitemap URLs:")

          for url in sitemap_urls:
              print(
                  f" - {url}"
              )

          PY

      # =========================================
      # COMMIT GENERATED FILES
      # =========================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate posts.json and sitemap.xml"
            git push
          fi
