name: Generate Blog Posts Manifest

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


jobs:

  generate-posts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate posts.json
        run: |

          python3 <<'PY'

          import json
          import re
          from pathlib import Path
          from html import unescape
          from urllib.parse import quote


          ROOT = Path(".")
          POSTS_DIR = ROOT / "posts"
          OUTPUT = ROOT / "posts.json"

          posts = []


          def clean_text(value):

              if not value:
                  return ""

              value = unescape(value)

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def get_first(patterns, html):

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      re.IGNORECASE |
                      re.DOTALL
                  )

                  if match:

                      return clean_text(
                          match.group(1)
                      )

              return ""


          def get_image(html):

              patterns = [

                  r'<figure[^>]*class=["\'][^"\']*post-featured-image[^"\']*["\'][^>]*>.*?<img[^>]+src=["\']([^"\']+)["\']',

                  r'<img[^>]+class=["\'][^"\']*post-featured-image[^"\']*["\'][^>]+src=["\']([^"\']+)["\']',

                  r'<img[^>]+src=["\']([^"\']+)["\'][^>]+class=["\'][^"\']*post-featured-image[^"\']*["\']'

              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      html,
                      re.IGNORECASE |
                      re.DOTALL
                  )

                  if match:

                      return clean_text(
                          match.group(1)
                      )

              return ""


          def get_excerpt(html):

              description = get_first(

                  [

                      r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)["\']',

                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']description["\']'

                  ],

                  html

              )

              if description:

                  return description


              paragraph = get_first(

                  [

                      r'<div[^>]*class=["\'][^"\']*post-content[^"\']*["\'][^>]*>\s*<p[^>]*>(.*?)</p>',

                      r'<article[^>]*>.*?<p[^>]*>(.*?)</p>'

                  ],

                  html

              )

              if paragraph:

                  paragraph = re.sub(
                      r"<[^>]+>",
                      " ",
                      paragraph
                  )

                  return clean_text(
                      paragraph
                  )

              return ""


          def get_search_text(html):

              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  html,
                  flags=
                  re.IGNORECASE |
                  re.DOTALL
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=
                  re.IGNORECASE |
                  re.DOTALL
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              return clean_text(
                  text
              )


          def get_date(html):

              patterns = [

                  r'<meta[^>]+name=["\']published-date["\'][^>]+content=["\']([^"\']+)["\']',

                  r'<meta[^>]+name=["\']date["\'][^>]+content=["\']([^"\']+)["\']',

                  r'<meta[^>]+name=["\']published["\'][^>]+content=["\']([^"\']+)["\']',

                  r'<meta[^>]+property=["\']article:published_time["\'][^>]+content=["\']([^"\']+)["\']',

                  r'<time[^>]+datetime=["\']([^"\']+)["\']',

                  r'data-published-date=["\']([^"\']+)["\']'

              ]

              for pattern in patterns:

                  value = get_first(
                      [pattern],
                      html
                  )

                  if value:

                      return value


              post_meta = get_first(

                  [

                      r'<div[^>]*class=["\'][^"\']*post-meta[^"\']*["\'][^>]*>(.*?)</div>',

                      r'<span[^>]*class=["\'][^"\']*post-meta[^"\']*["\'][^>]*>(.*?)</span>'

                  ],

                  html

              )

              if post_meta:

                  year = re.search(
                      r"\b20\d{2}\b",
                      post_meta
                  )

                  if year:

                      return year.group(0)


              header = get_first(

                  [
                      r'<header[^>]*class=["\'][^"\']*post-header[^"\']*["\'][^>]*>(.*?)</header>'
                  ],

                  html

              )

              if header:

                  year = re.search(
                      r"\b20\d{2}\b",
                      header
                  )

                  if year:

                      return year.group(0)


              return ""


          for file_path in sorted(
              POSTS_DIR.iterdir(),
              key=lambda path:
                  path.name.lower()
          ):

              if not file_path.is_file():
                  continue

              if file_path.suffix.lower() != ".html":
                  continue


              filename = file_path.name


              html = file_path.read_text(
                  encoding="utf-8",
                  errors="replace"
              )


              title = get_first(

                  [

                      r'<h1[^>]*>(.*?)</h1>',

                      r'<title[^>]*>(.*?)</title>'

                  ],

                  html

              )


              if not title:

                  title = file_path.stem


              category = get_first(

                  [

                      r'<div[^>]*class=["\'][^"\']*post-category[^"\']*["\'][^>]*>(.*?)</div>',

                      r'<span[^>]*class=["\'][^"\']*post-category[^"\']*["\'][^>]*>(.*?)</span>'

                  ],

                  html

              )


              if not category:

                  category = "BEYOND THE OBVIOUS"


              image = get_image(html)

              excerpt = get_excerpt(html)

              date = get_date(html)

              search_text = get_search_text(html)


              encoded_filename = quote(
                  filename,
                  safe=""
              )


              post_url = (
                  "posts/" +
                  encoded_filename
              )


              posts.append({

                  "file":
                      filename,

                  "url":
                      post_url,

                  "title":
                      title,

                  "category":
                      category,

                  "date":
                      date,

                  "image":
                      image,

                  "excerpt":
                      excerpt,

                  "searchText":
                      search_text

              })


          def sort_key(post):

              date = str(
                  post.get(
                      "date",
                      ""
                  )
              )

              match = re.search(
                  r"\b(20\d{2})\b",
                  date
              )

              if match:

                  return int(
                      match.group(1)
                  )

              return 0


          posts.sort(
              key=sort_key,
              reverse=True
          )


          OUTPUT.write_text(

              json.dumps(
                  posts,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"

          )


          print(
              "Generated posts.json with",
              len(posts),
              "posts."
          )


          for post in posts:

              print(
                  "-",
                  post["file"]
              )

          PY


      - name: Commit updated posts.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json

          if git diff --cached --quiet; then

            echo "posts.json is already up to date."

          else

            git commit -m "Automatically update blog posts manifest"

            git push

          fi
